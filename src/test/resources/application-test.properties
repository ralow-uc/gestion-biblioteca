# ---------------------------------------------------------------------------
# Perfil "test": H2 en memoria en modo Oracle.
# MODE=Oracle hace que H2 acepte la misma sintaxis de la base real, de modo que
# las pruebas validen el mismo mapeo JPA que se usa contra Oracle Cloud.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:biblioteca_test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
