# ---------------------------------------------------------------------------
# Perfil "oracle": conexion a la base de datos Oracle en la nube
# (Oracle Autonomous Database - FULLSTACK-3, region Chile Central / Santiago).
#
# Las credenciales NO se escriben aqui: se leen de variables de entorno para
# que nunca lleguen al repositorio. La forma comoda de arrancar es:
#
#     ./scripts/run-oracle.sh
#
# ese script arma la URL, toma la contrasena del Llavero de macOS y lanza el
# perfil "oracle". Si prefieres hacerlo a mano:
#
#     export ORACLE_JDBC_URL="jdbc:oracle:thin:@fullstack3_tp?TNS_ADMIN=$HOME/.oracle/wallets/FULLSTACK3"
#     export ORACLE_USER="ADMIN"
#     export ORACLE_PASSWORD="********"
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=oracle
#
# Alias TNS disponibles en el Wallet de esta base:
#     fullstack3_tp        <- el que usamos (workload transaccional)
#     fullstack3_tpurgent
#     fullstack3_high / _medium / _low
#
# CUIDADO con la ruta del Wallet: no puede contener espacios. El driver JDBC de
# Oracle los elimina al parsear el parametro TNS_ADMIN de la URL y la conexion
# falla con ORA-12263 ("no se puede acceder a tnsnames.ora"). Por eso el Wallet
# se guarda en ~/.oracle/wallets/FULLSTACK3 y no junto al proyecto.
#
# El Wallet descargado incluye cwallet.sso (auto-login), asi que JDBC no pide la
# contrasena del Wallet; solo hace falta la del usuario de base de datos.
# ---------------------------------------------------------------------------

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# La tabla LIBRO y la secuencia LIBRO_SEQ se crean con scripts/01_crear_tabla_libro.sql.
# "validate" comprueba que el mapeo JPA coincida con la tabla real y no modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
