# ---------------------------------------------------------------------------
# Perfil "local": H2 en memoria.
# Sirve para levantar el microservicio y probar el CRUD en Postman sin depender
# de la red ni de las credenciales de Oracle. No es la base de produccion.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:biblioteca;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 crea el esquema (tabla LIBRO y secuencia LIBRO_SEQ) a partir de la entidad JPA.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:biblioteca)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
