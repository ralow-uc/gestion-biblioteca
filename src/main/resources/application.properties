# ---------------------------------------------------------------------------
# Microservicio gestion-biblioteca
#
# Perfiles disponibles:
#   local   -> base de datos H2 en memoria, para desarrollar y probar sin credenciales.
#   oracle  -> Oracle Autonomous Database.
#
# El perfil se elige con la variable SPRING_PROFILES_ACTIVE o con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=oracle
# ---------------------------------------------------------------------------

spring.application.name=gestion-biblioteca
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8080

# Las respuestas de error incluyen el mensaje para facilitar la revision en Postman.
server.error.include-message=always

# Formato legible del JSON devuelto por el controlador REST.
spring.jackson.serialization.indent-output=true
